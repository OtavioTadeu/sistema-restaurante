databases:
  - name: dogao-db
    databaseName: restaurantedb
    user: restaurante_user
    plan: free

services:
  - type: web
    name: dogao-do-castelo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -w 2 -b 0.0.0.0:$PORT --log-file -
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dogao-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: RESTAURANTE_WHATSAPP
        sync: false
      - key: PRINTER_TOKEN
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
