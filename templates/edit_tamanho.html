<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Tamanho - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="admin-dashboard">
        <aside class="sidebar">
            <h2 class="sidebar-title">Painel Admin</h2>
            <nav>
                <a href="{{ url_for('admin') }}" class="active">Tamanhos</a>
                <a href="{{ url_for('admin_pratos') }}">Pratos</a>
                <a href="{{ url_for('admin_cardapio') }}">Cardápio do Dia</a>
                <a href="{{ url_for('admin_pedidos') }}">Pedidos</a>
                <a href="{{ url_for('admin_logout') }}" class="logout-link">Sair</a>
            </nav>
        </aside>
        
        <main class="main-content">
            <header>
                <h1>Editar Tamanho</h1>
            </header>
            
            <section class="card form-section">
                <form action="{{ url_for('edit_tamanho', tamanho_id=tamanho.id) }}" method="POST" class="modern-form">
                    <div class="form-group">
                        <label for="nome">Nome do Tamanho:</label>
                        <input type="text" id="nome" name="nome" value="{{ tamanho.nome }}" required>
                    </div>
                    <div class="form-group">
                        <label for="preco">Preço:</label>
                        <input type="number" step="0.01" id="preco" name="preco" value="{{ tamanho.preco }}" required>
                    </div>
                    <div style="margin-top: 20px; display: flex; gap: 10px;">
                        <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                        <a href="{{ url_for('admin') }}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
